# 測試：後端（假的模型、暫存的資料夾）和 app 的邏輯。不下載模型，幾分鐘跑完。
name: 測試

on:
  push:
    branches: [main]
    paths: ["studio/**", "mac/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["studio/**", "mac/**", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # mlx 只有 Apple Silicon 的 macOS 版本
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # make app 會下載可攜的 Python、照 requirements.lock 裝好套件；後端測試就用這一份跑，
      # 測到的跟包進 app 的是同一組
      - name: 建置 app
        working-directory: mac
        run: make app

      - name: 後端測試
        run: mac/.build/backend-stage/bin/python3 -m unittest discover -s studio/tests -t .

      - name: app 的邏輯測試
        working-directory: mac
        run: |
          swift --version
          swift test
